<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Todo App</title>
    <link rel="stylesheet" href="todo.css" />
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f6f8;
  padding: 40px;
}

.todo-app {
  max-width: 450px;
  background: #fff;
  margin: auto;
  padding: 20px;
  border-radius: 6px;
}

h2 {
  margin-bottom: 15px;
}

.add-task {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.add-task input,
.add-task button {
  padding: 8px;
}

.add-task input[type="text"] {
  flex: 1;
}

.add-task button {
  background: #2d7ff9;
  color: white;
  border: none;
  cursor: pointer;
}

.task-section {
  margin-top: 20px;
}

.task-section h3 {
  margin-bottom: 10px;
  font-size: 16px;
  color: #444;
}

.task-list {
  list-style: none;
}

.task-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f9f9f9;
  padding: 8px;
  margin-bottom: 8px;
  border-radius: 4px;
}

.left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.task-text {
  font-size: 14px;
}

.due-date {
  font-size: 12px;
  color: #666;
  margin-right: 8px;
}

.delete-btn {
  background: none;
  border: none;
  color: #d11a2a;
  font-size: 16px;
  cursor: pointer;
}

.task-item.done .task-text {
  text-decoration: line-through;
  color: #888;
}
    </style>
  </head>

  <body>
    <div class="todo-app">
      <h2>My Tasks</h2>

      <!-- Add Task -->
      <div class="add-task">
        <input type="text" placeholder="Enter task..." required />
        <input type="date" required />
        <button id="add-btn">Add</button>
      </div>

      <!-- Pending Tasks -->
      <div class="task-section">
        <h3>Pending</h3>

        <ul class="task-list pending">
          <!-- <li class="task-item">
          <div class="left">
            <input type="checkbox" />
            <span class="task-text">Complete HTML layout</span>
          </div>

          <div class="right">
            <span class="due-date">Due: 05 Jan</span>
            <button class="delete-btn">✕</button>
          </div>
        </li> -->
        </ul>
      </div>

      <!-- Completed Tasks -->
      <div class="task-section">
        <h3>Completed</h3>

        <ul class="task-list completed">
          <!-- <li class="task-item done">
          <div class="left">
            <input type="checkbox" checked />
            <span class="task-text">Create CSS file</span>
          </div>

          <div class="right">
            <span class="due-date">Done</span>
            <button class="delete-btn">✕</button>
          </div>
        </li> -->
        </ul>
      </div>
    </div>
    <!-- <script src="task.js"></script> -->
    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
       function loadTasks() {
        console.log("tasks", tasks);

      tasks.forEach((item) => {
        let list = document.createElement("li");
        list.innerHTML = `
         <div class="left">
            <input type="checkbox" class="task-checkbox" ${item.completed ? "checked" : ""} />
            <span class="task-text">${item.title}</span>
          </div>

          <div class="right">
            <span class="due-date">Due: ${item.dueDate}</span>
            <button class="delete-btn">✕</button>
          </div>
         `;
        if (item.completed == false) {
          list.classList.add("task-item");
          document.querySelector(".pending").appendChild(list);
        } else {
          list.classList.add("task-item", "done");
          document.querySelector(".completed").appendChild(list);
        }
      });

       }
         loadTasks();




 let deleteBtn = document.querySelectorAll('.delete-btn');
       deleteBtn.forEach(btn => {
       btn.addEventListener('click', function(e) {
           let li = e.target.parentElement.parentElement;     
           let spanText = li.children[0].children[1].innerText;
            li.remove();
              
         console.log("tasks1", tasks);
        
         tasks = tasks.filter(t => t.title !== spanText);
            
         console.log("tasks2", tasks);
         localStorage.setItem("tasks", JSON.stringify(tasks));
      
  });
});


// ADD task
   document.getElementById('add-btn').addEventListener('click', function() {

 
     let inputs = document.querySelectorAll(".add-task input");
let task = inputs[0];
let date = inputs[1];
           if (!task.value.trim()) {
    alert("Please enter a task title");
    return;
  }
  if (!date.value) {
    alert("Please select a due date");
    return;
  }
       console.log(date.value)
       let newTask = {
           title: task.value,
           dueDate: date.value,
           completed: false
       };
  
       
       tasks.push(newTask);
       localStorage.setItem("tasks", JSON.stringify(tasks));
       
       let list = document.createElement("li");
        list.innerHTML = `
         <div class="left">
            <input type="checkbox" class="task-checkbox" />
            <span class="task-text">${newTask.title}</span>
          </div>

          <div class="right">
            <span class="due-date">Due: ${newTask.dueDate}</span>
            <button class="delete-btn">✕</button>
          </div>
         `;
        list.classList.add("task-item");
        document.querySelector(".pending").appendChild(list);
        
        task.value = '';
        date.value = '';
         location.reload();
        });



document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
  checkbox.addEventListener("change", function(e) {
    let li = e.target.closest("li");
    let spanText = li.querySelector(".task-text").innerText;
for (let i = 0; i < tasks.length; i++) {
  if (tasks[i].title === spanText) {
    tasks[i].completed = e.target.checked; 
  }
}

     li.remove();
    console.log("Updated tasks:", tasks);
    localStorage.setItem("tasks", JSON.stringify(tasks));

   location.reload();
  });
});


    </script>
  </body>
</html>
