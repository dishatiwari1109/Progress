<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calci.css" />
  </head>
  <body>
    <div class="calculator">
      <input type="text" class="display" placeholder="0" disabled />
      <div class="buttons">
        <button class="val">/</button>
        <button class="val">1</button>
        <button class="val">2</button>
        <button class="val">3</button>
        <button class="val">*</button>
        <button class="val">4</button>
        <button class="val">5</button>
        <button class="val">6</button>
        <button class="val">-</button>
        <button class="val">7</button>
        <button class="val">8</button>
        <button class="val">9</button>
        <button class="val">+</button>
        <button class="val">0</button>
        <button style="grid-column-start: span 2;" id="equal">=</button>
      </div>
    </div>
  </body>
  <script>
        let num=document.querySelectorAll('.val');
        num.forEach(function(button) {
            button.addEventListener('click', function(e){
                document.querySelector('.display').value += button.innerText;
            });
        });
        let eq=document.getElementById('equal');
        eq.addEventListener('click', function () {
        let exp = document.querySelector('.display').value;
        if (exp !== "") {
          let result;
          let operator;
          if (exp.includes('+')) 
            operator= '+';
          else if (exp.includes('-')) 
            operator= '-';
          else if (exp.includes('*')) 
          operator= '*';
          else if (exp.includes('/')) 
            operator= '/';
          else {
            document.querySelector('.display').value = "Error";
            return;
          }
          let parts=exp.split(operator);
          let num1=Number(parts[0]);
          let num2=Number(parts[1]);
          switch (operator) {
            case '+':
              result=num1+num2;
              break;
            case '-':
              result=num1-num2;
              break;
            case '*':
              result=num1*num2;
              break;
            case '/':
              result=num2!== 0 ? num1/num2 : "Error";
              break;
            default:
              result="Error";
          }
          document.querySelector('.display').value = result;
        }
      });

  </script>
</html>
