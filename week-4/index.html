<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: aqua; display: flex; flex-direction: column; height: 100vh; justify-content: space-around; align-items: center;">
    <button style="padding: 10px; border: 4px solid black; border-radius: 10px; align-self: center;">Change Theme</button>
</body>
<script>
    const button = document.querySelector('button');
    const body = document.querySelector('body');
    button.addEventListener('click', () => {
        let randomColor = Math.floor(Math.random()*16777215).toString(16);
        body.style.backgroundColor = `#${randomColor}`;
    });
</script>
</html>
